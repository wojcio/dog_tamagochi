MEMORY {
    # Zero Page RAM ($0000 - $00FF)
    ZP:     start = $0000, size = $0100, type = rw;

    # OAM Sprite Buffer ($0200 - $02FF)
    OAM:    start = $0200, size = $0100, type = rw;

    # General RAM ($0300 - $07FF)
    RAM:    start = $0300, size = $0500, type = rw;

    # iNES 16-byte Header
    HEADER: start = $0000, size = $0010, type = ro, file = %O, fill = yes;

    # 32KB PRG-ROM ($8000 - $FFFF)
    PRG:    start = $8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $00;

    # 8KB CHR-ROM
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAM,    type = bss, optional = yes;
    BSS:      load = RAM,    type = bss, optional = yes;
    CODE:     load = PRG,    type = ro,  start = $8000;
    RODATA:   load = PRG,    type = ro,  optional = yes;
    DATA:     load = PRG,    run = RAM,  type = rw, optional = yes;
    VECTORS:  load = PRG,    type = ro,  start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
