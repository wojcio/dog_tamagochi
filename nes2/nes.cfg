SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $0700;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $00FE, type = rw, define = yes;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    PRG:    file = %O, start = $8000, size = $7FFA, fill = yes, define = yes;
    VECTORS:file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:    file = %O, start = $0000, size = $2000, fill = yes;
    RAM:    file = "", start = $0300, size = $0400, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,              type = zp;
    HEADER:   load = HEADER,          type = ro;
    STARTUP:  load = PRG,             type = ro,  define = yes;
    LOWCODE:  load = PRG,             type = ro,  optional = yes;
    ONCE:     load = PRG,             type = ro,  optional = yes;
    CODE:     load = PRG,             type = ro,  define = yes;
    RODATA:   load = PRG,             type = ro,  define = yes;
    DATA:     load = PRG, run = RAM,  type = rw,  define = yes;
    BSS:      load = RAM,             type = bss, define = yes;
    CHARS:    load = CHR,             type = ro;
    VECTORS:  load = VECTORS,         type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
